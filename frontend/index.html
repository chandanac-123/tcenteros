<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="https://tcenteros.com/og-image.png" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />

  <!-- Title -->
  <title> TCenterOS | Gym Management Software & Fitness CRM Platform India</title>
  <!-- SEO Meta -->
  <meta name="description"
    content="TCenterOS is an all-in-one gym and training center management software in India. Manage memberships, billing, renewals, attendance, CRM, branches, networking, and revenue analytics from a single platform." />
  <meta name="keywords"
    content="gym management software, fitness center software, gym CRM, membership management software, training center management software, academy management system, fitness ERP, gym billing software India, attendance tracking software" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="https://tcenteros.com/" />

  <!-- Open Graph (Facebook / WhatsApp) -->
  <meta property="og:title" content="TCenterOS - Smart Gym & Training Management Software" />
  <meta property="og:description"
    content="Manage memberships, subscriptions and revenue using one powerful SaaS platform." />
  <meta property="og:image" content="https://tcenteros.com/og-image.png" />

  <meta property="og:url" content="https://tcenteros.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TCenterOS" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TCenterOS - Training & Fitness SaaS Platform" />
  <meta name="twitter:description" content="Manage your training center memberships and revenue with TCenterOS." />
  <meta name="twitter:image" content="https://tcenteros.com/og-image.png" />

  <!-- Performance (fonts optimization example) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "TCenterOS",
        "applicationCategory": "BusinessApplication",

          "Billing and Invoicing",

          "Network Gym Access",

        "description": "Gym and training center management software",
        "url": "https://tcenteros.com",
        "image": "https://tcenteros.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
