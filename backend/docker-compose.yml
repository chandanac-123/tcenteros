

services:
  backend:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    container_name: tcenteros_db
    environment:
      POSTGRES_DB: tcenteros_db123
      POSTGRES_USER: tcenteros_user123
      POSTGRES_PASSWORD: tcenteros_pass123
    ports:
      - "5432:5432"   # optional (for local access)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
